AWS_REGION=us-east-1
# Floci's ECR emulator registry container, addressed by its pinned IP on
# the `floci-static` Docker network. platform-infrastructure pins this via
# local.static_ips.ecr_registry (terraform_data.ensure_ecr_registry_network
# and ensure_registry_pull_mirror) so it no longer drifts across Floci
# restarts the way the old default-bridge address (172.17.0.x) did.
#
# The Jenkins container and every `docker build` / `docker push` from this
# pipeline run against the host Docker daemon, which manages floci-static
# and can reach this address directly. Requires `172.30.0.20:5000` in
# Docker Desktop's insecure-registries (Settings -> Docker Engine): the
# registry is plain HTTP and `docker push` refuses HTTP registries
# otherwise. One-time host setup.
ECR_REGISTRY=172.30.0.20:5000/ai-notification
K8S_ENV=local
# Durable off-box mirror. The pipeline pushes every image here too, as
# docker.io/<namespace>/ai-notification-<service>:<sha>. Free-tier Docker
# Hub allows only one private repo, so these 13 repos must be public.
DOCKERHUB_NAMESPACE=docker.io/dip75016860
