AWS_REGION=us-east-1
# NOT the .localhost:5100 address used from the Mac host (aws/docker CLI
# outside any container) — that only resolves to loopback, which from
# *inside* a Floci-managed container means itself, not the Floci host. All
# Floci-managed containers (Jenkins' build-agent pods included -- their
# egress traffic gets NAT'd out through the k3s node container, which sits
# on this same bridge) and the ECR registry container sit on the same
# default Docker bridge network, so the registry's bridge-internal address
# is what's actually reachable here.
#
# Caveat this project has now hit three times: this IP isn't stable across
# a Floci restart (the registry container gets recreated, drawing whatever
# address Docker hands out next) -- confirmed live each time, kaniko push
# failing with "connection refused" against a stale address left over from
# the previous container. Re-verify with
# `docker inspect floci-ecr-registry --format
# '{{.NetworkSettings.Networks.bridge.IPAddress}}'` any time pushes/pulls
# start failing after a Floci restart.
ECR_REGISTRY=172.17.0.3:5000/ai-notification
K8S_ENV=local
