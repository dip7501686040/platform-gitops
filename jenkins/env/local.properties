AWS_REGION=us-east-1
# NOT the .localhost:5100 address used from the Mac host (aws/docker CLI
# outside any container) — that only resolves to loopback, which from
# *inside* the Jenkins EC2-emulation container means itself, not the Floci
# host. All Floci-managed containers (this instance, the ECR registry, the
# k3s/EKS node) sit on the same default Docker bridge network, so the
# registry's bridge-internal address is what's actually reachable here —
# verified via `curl http://172.17.0.3:5000/v2/` from inside the instance.
# This also happens to be reachable from k3s for image pulls, since it's
# on the same bridge. Caveat: this IP isn't guaranteed stable if the Floci
# container is ever recreated — re-verify with `docker inspect
# floci-ecr-registry --format '{{.NetworkSettings.Networks.bridge.IPAddress}}'`
# if pushes/pulls start failing after a Floci restart.
ECR_REGISTRY=172.17.0.3:5000/ai-notification
K8S_ENV=local
