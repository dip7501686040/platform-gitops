AWS_REGION=us-east-1
# Two addresses for the ONE Floci ECR registry container (registry:2):
#
#  ECR_PUSH_REGISTRY  - where the CI pipeline pushes. The push runs on the
#    host Docker daemon, and Docker Desktop for Mac cannot route to a custom
#    bridge network's container IPs -- only the container's *published* host
#    port works. Floci publishes the registry's :5000 on host :5100, and
#    127.0.0.0/8 is an insecure registry by default, so no daemon config is
#    needed for this one.
#
#  ECR_REGISTRY  - what gets written into k8s/environments/local/values-*.yaml
#    as image.repository, i.e. the address a k3s node pulls from later.
#    "localhost" is wrong there (means the node itself), so this stays the
#    registry's pinned floci-static IP. Same container, same blob store as
#    ECR_PUSH_REGISTRY -- an image pushed via :5100 is pullable via
#    172.30.0.20:5000 (through ensure_registry_pull_mirror's containerd
#    mirror) with no re-push.
ECR_PUSH_REGISTRY=localhost:5100/ai-notification
ECR_REGISTRY=172.30.0.20:5000/ai-notification
K8S_ENV=local
# Durable off-box mirror. The pipeline pushes every image here too, as
# docker.io/<namespace>/ai-notification-<service>:<sha>. Free-tier Docker
# Hub allows only one private repo, so these 13 repos must be public.
DOCKERHUB_NAMESPACE=docker.io/dip75016860
