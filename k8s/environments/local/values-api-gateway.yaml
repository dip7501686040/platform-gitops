image:
  repository: 172.17.0.3:5000/ai-notification/api-gateway
  tag: "00d35327"

healthGrpcPort: 50051
httpPort: 8000

database:
  enabled: false

serviceType: NodePort
httpNodePort: 30081

# The one nest-service with real request-rate/latency metrics worth
# graphing per-pod (see tenant-metrics.interceptor.ts). Every other
# nest-service stays off (chart default) -- no metrics worth exposing yet.
metrics:
  enabled: true

env:
  # web is reached through the ALB now (localhost:8080 -- see
  # platform-infrastructure's alb_web_local_port), not a kubectl tunnel.
  CORS_ORIGINS: "http://localhost:8080"
  FRONTEND_URL: "http://localhost:8080"
  # Same Google OAuth client already used for bare `pnpm dev`
  # (apps/api-gateway/.env) -- not sensitive, safe as plain config.
  # GOOGLE_CLIENT_SECRET is sensitive and goes through app-secrets instead
  # (platform-infrastructure's secrets.local.tfvars).
  GOOGLE_CLIENT_ID: "38603231523-0jag1il5veuu88keo1p2fhiosos3a4u6.apps.googleusercontent.com"
  GOOGLE_CALLBACK_URL: "http://localhost:8000/auth/google/callback"
