image:
  # TODO: replace with the real ECR URL once real-AWS Terraform is applied
  # (see terraform outputs.ecr_repository_urls).
  repository: docker.io/dip75016860/ai-notification
  tag: "api-gateway-0eabe1bb"

healthGrpcPort: 50051
httpPort: 8000

# Entry point + HPA target (Phase 7) -- needs more headroom than the thin
# CRUD services the chart default now targets.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

database:
  schemaHash: "initial"
  enabled: false

serviceType: NodePort
httpNodePort: 30081

# The one nest-service with real request-rate/latency metrics worth
# graphing per-pod (see tenant-metrics.interceptor.ts). Every other
# nest-service stays off (chart default) -- no metrics worth exposing yet.
metrics:
  enabled: true

env:
  CORS_ORIGINS: "https://ainotification.duckdns.org"
  FRONTEND_URL: "https://ainotification.duckdns.org"
  # Same Google OAuth client already used for local dev -- not sensitive,
  # safe as plain config. GOOGLE_CLIENT_SECRET is sensitive and comes from
  # the app-secrets Secret (platform-infrastructure's oci/backing-services.tf)
  # -- currently blank there, so Google sign-in still won't complete the
  # token exchange until a real secret is filled in and applied.
  GOOGLE_CLIENT_ID: "38603231523-0jag1il5veuu88keo1p2fhiosos3a4u6.apps.googleusercontent.com"
  GOOGLE_CALLBACK_URL: "https://ainotification-api.duckdns.org/auth/google/callback"
