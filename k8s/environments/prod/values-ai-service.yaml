image:
  # TODO: replace with the real ECR URL once real-AWS Terraform is applied
  # (see terraform outputs.ecr_repository_urls).
  repository: docker.io/dip75016860/ai-notification
  tag: "ai-service-0cc64eb8"

healthGrpcPort: 50055
appGrpcPort: 50155
appGrpcPortEnvName: AI_GRPC_PORT

database:
  schemaHash: "e597c7f086e5"
  enabled: true
  name: ai_db

# Makes real outbound LLM calls (OpenAI) -- needs headroom for response
# buffering/streaming, not CPU, unlike the thin CRUD services the chart
# default now targets.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi
