# storageClassName: "" uses the cluster default (Floci's k3s ships
# local-path-provisioner out of the box). Set to "gp3" for AWS once the
# gp3 StorageClass exists (createGp3StorageClass: true creates it here).
storageClassName: ""
createGp3StorageClass: false

postgres:
  image: postgres:16-alpine
  storageSize: 2Gi

rabbitmq:
  image: rabbitmq:3-management-alpine
  storageSize: 1Gi

redis:
  image: redis:7-alpine
