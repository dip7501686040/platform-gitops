apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "nest-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      {{- if .Values.metrics.enabled }}
      annotations:
        # Annotation-based discovery, not a ServiceMonitor -- picked up
        # automatically by the Prometheus chart's default kubernetes-pods
        # scrape job (platform-infrastructure's prometheus_install), no
        # CRDs involved. This is what gives per-pod attribution -- the
        # scrape target is this exact pod's own IP, not a shared endpoint.
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "/metrics"
      {{- end }}
    spec:
      {{- if or .Values.dependsOn.rabbitmq .Values.database.enabled }}
      # busybox, not this service's own image -- these need nothing but a
      # TCP-connect check, and using the app image here would mean paying
      # its full pull/start cost twice (once to wait, once to actually run)
      # for no benefit.
      initContainers:
        {{- if .Values.dependsOn.rabbitmq }}
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 {{ .Values.rabbitmqHost }} {{ .Values.rabbitmqPort }}; do
                echo "waiting for {{ .Values.rabbitmqHost }}:{{ .Values.rabbitmqPort }}..."
                sleep 2
              done
        {{- end }}
        {{- if .Values.database.enabled }}
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w2 {{ .Values.postgresHost }} 5432; do
                echo "waiting for {{ .Values.postgresHost }}:5432..."
                sleep 2
              done
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- if .Values.httpPort }}
            - name: http
              containerPort: {{ .Values.httpPort }}
            {{- end }}
            {{- if .Values.appGrpcPort }}
            - name: grpc
              containerPort: {{ .Values.appGrpcPort }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
            - name: health
              containerPort: {{ .Values.healthGrpcPort }}
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: GRPC_PORT
              value: "{{ .Values.healthGrpcPort }}"
            {{- if .Values.appGrpcPort }}
            - name: {{ .Values.appGrpcPortEnvName }}
              value: "{{ .Values.appGrpcPort }}"
            {{- end }}
            {{- if .Values.httpPort }}
            - name: PORT
              value: "{{ .Values.httpPort }}"
            {{- end }}
            {{- if .Values.database.enabled }}
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@{{ .Values.postgresHost }}:5432/{{ .Values.database.name }}"
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PROMETHEUS_PORT
              value: "{{ .Values.metrics.port }}"
            {{- end }}
            {{- if .Values.otelExporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.otelExporterOtlpEndpoint }}"
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- /*
          Same class of fix as backing-services' rabbitmq.yaml and ArgoCD's
          values-core.yaml: timeoutSeconds defaulted to Kubernetes' bare 1s
          minimum here too, unset like the others were. Under real load
          (several services cold-starting together) a 1s-timeout probe can
          kill an otherwise-fine pod just for answering slightly late, which
          only adds to the CPU spike this whole file's initContainers are
          trying to reduce, not help it.
          */ -}}
          {{- if .Values.httpPort }}
          livenessProbe:
            httpGet:
              path: {{ .Values.httpHealthPath }}
              port: {{ .Values.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ .Values.httpHealthPath }}
              port: {{ .Values.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          {{- else }}
          livenessProbe:
            grpc:
              port: {{ .Values.healthGrpcPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            grpc:
              port: {{ .Values.healthGrpcPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
