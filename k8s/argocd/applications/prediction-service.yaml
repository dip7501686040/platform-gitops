apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prediction-service
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/dip7501686040/platform-gitops.git
      targetRevision: main
      path: k8s/charts/prediction-service
      helm:
        releaseName: prediction-service
        valueFiles:
          - $values/k8s/environments/local/values-prediction-service.yaml
    - repoURL: https://github.com/dip7501686040/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    # ArgoCD itself now lives on its own cluster (platform-infrastructure's
    # argocd cluster) and manages app_services remotely -- registered as
    # "app-services" by main.tf's argocd_register_app_services. `name:`
    # here, not `server: https://kubernetes.default.svc` (which only ever
    # meant "this same cluster ArgoCD is running on", not true anymore).
    name: app-services
    namespace: ai-notification
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
