apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/dip7501686040/platform-gitops.git
      targetRevision: main
      path: k8s/charts/web
      helm:
        releaseName: web
        valueFiles:
          - $values/k8s/environments/local/values-web.yaml
    - repoURL: https://github.com/dip7501686040/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    # See prediction-service.yaml's comment: ArgoCD now runs on its own
    # cluster and manages app_services remotely as registered cluster
    # "app-services".
    name: app-services
    namespace: ai-notification
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
