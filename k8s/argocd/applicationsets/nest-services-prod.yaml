# Prod equivalent of nest-services-local.yaml -- same chart, same pattern,
# targeting k8s/environments/prod/ instead. ArgoCD runs on the SAME single
# OKE cluster as the workloads here (unlike the local setup's separate
# ArgoCD cluster managing app_services remotely as a registered cluster),
# so destination.server is the in-cluster address, not a registered name.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nest-services-prod
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: api-gateway
          - service: identity-service
          - service: tenant-service
          - service: event-service
          - service: ai-service
          - service: rule-engine-service
          - service: notification-service
          - service: channel-service
          - service: template-service
          - service: analytics-service
          - service: audit-service
  template:
    metadata:
      name: "{{service}}"
      namespace: argocd
      labels:
        rollout-group: nest-services
    spec:
      project: default
      sources:
        - repoURL: https://github.com/dip7501686040/platform-gitops.git
          targetRevision: main
          path: k8s/charts/nest-service
          helm:
            releaseName: "{{service}}"
            valueFiles:
              - $values/k8s/environments/prod/values-{{service}}.yaml
        - repoURL: https://github.com/dip7501686040/platform-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: ai-notification
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      # api-gateway is the planned HPA target (Phase 7); applying this to
      # every generated Application uniformly rather than special-casing
      # just that one -- harmless for the other 10 (nothing else changes
      # their replica count externally yet), and covers any future HPA
      # without a manifest change.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
  # Same RollingSync reasoning as the local setup: bounds concurrent
  # migrate-job PreSync hooks so a multi-service deploy can't repeat the
  # "many simultaneous prisma migrate deploy processes" CPU spike.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: rollout-group
              operator: In
              values: [nest-services]
          maxUpdate: "1"
