# Lightweight ArgoCD install for resource-constrained dev machines: disables
# the components this project's single-repo, single-cluster GitOps setup
# doesn't need (SSO/dex, notifications). Note: this chart version has no
# toggle to disable the ApplicationSet controller — it always runs, but it's
# a single small pod.

# Progressive Syncs (RollingSync ApplicationSet strategy) is opt-in, not
# on by default -- needed by nest-services-local.yaml's rollingSync strategy
# (bounds how many nest-service Applications sync concurrently, so a real
# multi-service deploy can't repeat the "8 prisma migrate jobs at once" CPU
# spike a fully-parallel sync would risk).
applicationSet:
  extraArgs:
    - --enable-progressive-syncs

dex:
  enabled: false

notifications:
  enabled: false

redis:
  enabled: true

# Same class of fix as backing-services' rabbitmq.yaml probes, same root
# cause: every one of these defaults to timeoutSeconds: 1 chart-side --
# confirmed live, under real load (a Jenkins/observability rollout running
# concurrently) argocd-server and repoServer both crash-looped on failed
# liveness probes (22 and 16 restarts respectively) even though neither
# was actually broken, just briefly slow to answer. controller's own
# readinessProbe timed out the same way without restarting it (readiness
# failures don't trigger a kill the way liveness ones do), which still
# knocked it out of Service endpoints while under load. 10s/6 gives real
# headroom without masking a genuine hang (6 x 10s period = 60s of
# sustained failure before anything gets killed, same tradeoff already
# made for RabbitMQ).
controller:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6

server:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  # --insecure: serves plain HTTP on 8080 instead of HTTPS on 8443/redirect.
  # Needed so the argocd cluster's ALB (HTTP-only target groups/listeners,
  # same as every other ALB this project emulates via Floci) can actually
  # front it -- an HTTP listener can't forward to an HTTPS-only backend.
  # No real trust boundary here to give up (self-signed cert either way, on
  # a purely local dev cluster). Reached via a hand-written NodePort Service
  # (main.tf's argocd_nodeport_service) + module.loadbalancer_argocd -- no
  # kubectl port-forward tunnel anymore.
  extraArgs:
    - --insecure
  service:
    type: ClusterIP
